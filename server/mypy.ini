; Baseline mypy gate: lenient today, tighten incrementally.
; Goal: no new untyped modules; migrate hot paths (core/, security/, services/execution/) first.
[mypy]
python_version = 3.12
ignore_missing_imports = True
allow_untyped_defs = True
allow_untyped_calls = True
warn_unused_ignores = True
show_error_codes = True
; Tighten per-module as hints land (examples of strict cores):
; [mypy-security.crypto]
; disallow_untyped_defs = True
; tools/ + migrations/ are dev-only probes / one-time scripts, not product code.
exclude = venv/|\.venv/|__pycache__|\.pytest_cache/|tools/|migrations/
