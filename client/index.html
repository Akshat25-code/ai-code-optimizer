      content="AI Code Optimizer analyzes complexity, finds bugs, optimizes performance, and verifies results in a sandboxed runner. Free to start."
    />
    <link rel="canonical" href="https://aicodeoptimizerpromax.com/" />
    <!-- Open Graph / Twitter social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AI Code Optimizer" />
    <meta property="og:title" content="AI Code Optimizer — Analyze, Optimize & Verify Code with AI" />
    <meta
      property="og:description"
      content="Static analysis, AI review, sandboxed execution proof, and reports — free to start."
    />
    <meta property="og:image" content="https://aicodeoptimizerpromax.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Code Optimizer — Analyze, Optimize & Verify Code with AI" />

      name="twitter:description"
      content="Static analysis, AI review, sandboxed execution proof, and reports — free to start."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('theme') || 'system';
          var isDark = t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#050508" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            console.log('SW registered: ', reg.scope);
          }).catch(err => {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
