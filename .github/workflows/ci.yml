name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Backend tests
  backend-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: pip install ruff && ruff check . || true

      - name: Type check (mypy ratchet)
        # mypy is pinned so CI counts match mypy_baseline.txt (a newer mypy
        # could report a different error count and false-fail the ratchet).
        run: |
          pip install "mypy==2.3.0"
          ACTUAL=$(python -m mypy . --config-file mypy.ini --no-error-summary 2>/dev/null | grep -c ": error:" || true)
          BASELINE=$(cat mypy_baseline.txt)
          echo "mypy errors: $ACTUAL (baseline $BASELINE)"
          if [ "$ACTUAL" -gt "$BASELINE" ]; then echo "mypy error count increased above baseline"; exit 1; fi

      - name: Security scan (bandit)
        # NOTE: use --exclude (long form). The -x short form does not exclude
        # here and lets tests/ findings fail the gate (see test_sandbox_escape).
        # bandit is pinned so new checks can't false-fail the gate.
        run: pip install "bandit==1.9.4" && bandit -r . -ll --exclude ./tests,./venv,./.venv

      - name: Complexity check (radon)
        run: pip install radon && radon cc . -s -n B -x venv,.venv || true

      - name: Run tests with coverage gate
        env:
          SKIP_MONGO_INIT: "1"
          ALLOW_FAKE_AI: "1"
          APP_ENV: testing
          JWT_SECRET_KEY: ci-test-secret
        run: pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-fail-under=60

      - name: Dependency audit (pip-audit)
        run: pip install pip-audit && pip-audit

  docker-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build Docker image
        run: docker build -t aco-test:ci .
      - name: Smoke test boots
        run: timeout 20 docker run --rm -e SKIP_MONGO_INIT=1 -e JWT_SECRET_KEY=ci-test-secret -e APP_ENV=testing aco-test:ci python -c "import main; print('boot ok')"

  # Frontend build check
  frontend-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test -- --run

      - name: Audit frontend
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
